<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>GENESYS_SMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e8e4dc;
            transition: background 0.3s, color 0.3s;
            min-height: 100vh;
        }
        
        body.light {
            --primary: #2d6a4f;
            --primary-dark: #1b4332;
            --primary-light: #40916c;
            --secondary: #d4a373;
            --accent: #e76f51;
            --text: #1a1a2e;
            --text-light: #4a4a6a;
            --border: #e0d6c8;
            --card-bg: #ffffff;
            --bg-page: #f5f0eb;
            --shadow: rgba(0, 0, 0, 0.06);
            --hover-bg: #f0ebe2;
            --success: #0d9488;
            --danger: #dc2626;
            --warning: #d97706;
            --purple: #7c3aed;
            --glass: rgba(255, 255, 255, 0.7);
        }
        
        body.dark {
            --primary: #40916c;
            --primary-dark: #2d6a4f;
            --primary-light: #52b788;
            --secondary: #d4a373;
            --accent: #e76f51;
            --text: #e8e4dc;
            --text-light: #9a9ab5;
            --border: #2a2a4a;
            --card-bg: #14141f;
            --bg-page: #0a0a0f;
            --shadow: rgba(0, 0, 0, 0.3);
            --hover-bg: #1f1f35;
            --success: #0d9488;
            --danger: #dc2626;
            --warning: #d97706;
            --purple: #7c3aed;
            --glass: rgba(20, 20, 31, 0.8);
        }
        
        body.light { background: var(--bg-page); }
        body.dark { background: var(--bg-page); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }

        .settings-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 1000;
            border: 1px solid var(--border);
            font-size: 1.2rem;
            transition: all 0.3s ease;
            color: var(--text);
        }
        .settings-btn:hover { transform: scale(1.05); background: var(--hover-bg); }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: var(--card-bg);
            border-radius: 24px;
            max-width: 480px;
            width: 100%;
            padding: 32px;
            border: 1px solid var(--border);
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .modal-header {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .modal-close {
            cursor: pointer;
            font-size: 1.5rem;
            line-height: 1;
            color: var(--text-light);
            transition: transform 0.2s;
        }
        .modal-close:hover { transform: rotate(90deg); }
        
        .theme-options { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
        .theme-card {
            flex: 1;
            min-width: 100px;
            padding: 16px;
            border-radius: 16px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            border: 2px solid var(--border);
            background: var(--card-bg);
        }
        .theme-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .theme-card.selected { border-color: var(--primary); background: var(--hover-bg); }
        .theme-preview {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin: 0 auto 10px;
            border: 2px solid var(--border);
        }
        .light-preview { background: linear-gradient(135deg, #f5f0eb, #ffffff); }
        .dark-preview { background: linear-gradient(135deg, #0a0a0f, #14141f); }

        .menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 1000;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }
        .menu-btn:hover { background: var(--hover-bg); }
        .menu-btn span { width: 22px; height: 2px; background: var(--text); border-radius: 4px; transition: 0.3s; }

        .side-menu {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100vh;
            background: var(--card-bg);
            box-shadow: 4px 0 30px rgba(0,0,0,0.2);
            z-index: 999;
            transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 80px 20px 20px;
            overflow-y: auto;
            border-right: 1px solid var(--border);
        }
        .side-menu.open { left: 0; }
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 998;
            display: none;
        }
        .menu-overlay.show { display: block; }

        .menu-item {
            padding: 12px 16px;
            margin-bottom: 6px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .menu-item:hover { background: var(--hover-bg); transform: translateX(4px); }
        .menu-item.active { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(45, 106, 79, 0.3); }
        .menu-icon { font-size: 1.2rem; width: 26px; text-align: center; }

        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 24px 30px;
        }

        .page { display: none; animation: fadeSlide 0.35s ease; }
        .page.active-page { display: block; }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 2px 12px var(--shadow);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }
        .card:hover { box-shadow: 0 4px 24px var(--shadow); }
        .card-header {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding-bottom: 14px;
            border-bottom: 2px solid var(--border);
            letter-spacing: -0.3px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--hover-bg);
            border-radius: 16px;
            padding: 18px 16px;
            text-align: center;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            cursor: default;
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px var(--shadow); }
        .stat-number { 
            font-size: 1.8rem; 
            font-weight: 700; 
            color: var(--primary);
            letter-spacing: -0.5px;
            line-height: 1.2;
        }
        .stat-label { 
            font-size: 0.7rem; 
            text-transform: uppercase; 
            letter-spacing: 0.8px; 
            color: var(--text-light); 
            margin-top: 6px;
            font-weight: 500;
        }
        .stat-card.accent .stat-number { color: var(--accent); }
        .stat-card.warning .stat-number { color: var(--warning); }
        .stat-card.success .stat-number { color: var(--success); }
        .stat-card.purple .stat-number { color: var(--purple); }

        .wallet-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 20px;
            padding: 28px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 30px rgba(45, 106, 79, 0.25);
        }
        .wallet-card .amount {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: -1px;
        }
        .wallet-card .label {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }
        .wallet-card .sub {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-top: 8px;
        }

        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .login-box {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 44px 36px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
            border: 1px solid var(--border);
        }
        .login-box h2 { 
            text-align: center; 
            margin-bottom: 32px; 
            color: var(--primary);
            font-weight: 700;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
        }
        .login-error { 
            background: rgba(220, 38, 38, 0.1); 
            color: var(--danger); 
            padding: 12px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            display: none; 
            text-align: center; 
            font-size: 0.85rem;
            border: 1px solid rgba(220, 38, 38, 0.2);
        }

        .suspended-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            text-align: center;
            background: var(--bg-page);
        }
        .suspended-screen .icon {
            font-size: 80px;
            margin-bottom: 24px;
        }
        .suspended-screen h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--danger);
            margin-bottom: 16px;
        }
        .suspended-screen .message {
            font-size: 1.1rem;
            color: var(--text-light);
            max-width: 500px;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .suspended-screen .footer {
            margin-top: 40px;
            color: var(--text-light);
            font-size: 0.8rem;
            opacity: 0.6;
        }
        .suspended-screen .contact-links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }
        .suspended-screen .contact-links a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        .suspended-screen .contact-links a:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--shadow);
            border-color: var(--primary);
        }
        .suspended-screen .contact-links a.telegram { color: #0088cc; }
        .suspended-screen .contact-links a.whatsapp { color: #25D366; }
        .suspended-screen .contact-links a.gmail { color: #EA4335; }

        .input-group { margin-bottom: 18px; }
        label { 
            display: block; 
            font-weight: 500; 
            margin-bottom: 6px; 
            color: var(--text); 
            font-size: 0.8rem;
            letter-spacing: 0.3px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 14px;
            font-size: 0.95rem;
            background: var(--card-bg);
            color: var(--text);
            font-family: inherit;
            transition: all 0.3s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(45, 106, 79, 0.1);
        }
        textarea { resize: vertical; min-height: 80px; }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.2px;
        }
        button:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(45, 106, 79, 0.25); }
        button:active { transform: translateY(0); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-secondary { background: var(--secondary); }
        .btn-secondary:hover { background: #c49a6b; }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #b91c1c; box-shadow: 0 6px 20px rgba(220, 38, 38, 0.25); }
        .btn-sm { padding: 8px 16px; font-size: 0.78rem; border-radius: 10px; }
        .btn-success { background: var(--success); }
        .btn-success:hover { background: #0f766e; box-shadow: 0 6px 20px rgba(13, 148, 136, 0.25); }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover { background: var(--hover-bg); box-shadow: none; transform: translateY(-2px); }
        .btn-warning { background: var(--warning); }
        .btn-warning:hover { background: #b45309; }

        .data-table { overflow-x: auto; border-radius: 14px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { 
            font-weight: 600; 
            color: var(--text-light); 
            font-size: 0.7rem; 
            text-transform: uppercase; 
            letter-spacing: 0.8px;
            border-bottom: 2px solid var(--border);
        }
        tr:hover td { background: var(--hover-bg); }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            display: inline-block;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .badge-pending { background: var(--warning); color: white; }
        .badge-paid { background: var(--success); color: white; }
        .badge-admin { background: var(--purple); color: white; }
        .badge-user { background: var(--primary); color: white; }
        .badge-rejected { background: var(--danger); color: white; }
        .badge-suspended { background: var(--danger); color: white; }
        .badge-active { background: var(--success); color: white; }

        .filter-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-end;
            margin-bottom: 20px;
        }
        .filter-group { flex: 1; min-width: 130px; }
        .filter-group label { font-size: 0.7rem; margin-bottom: 4px; color: var(--text-light); }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text);
            color: var(--card-bg);
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 0.85rem;
            z-index: 1001;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            white-space: nowrap;
            max-width: 90%;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .live-badge {
            background: var(--success);
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .live-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .status-indicator {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .status-indicator.online { background: rgba(13, 148, 136, 0.15); color: var(--success); }
        .status-indicator.offline { background: rgba(220, 38, 38, 0.15); color: var(--danger); }
        .status-indicator.testing { background: rgba(217, 119, 6, 0.15); color: var(--warning); }

        .item-card {
            background: var(--hover-bg);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }
        .item-card:hover { border-color: var(--primary); }

        .console-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--hover-bg);
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 8px;
        }
        .console-status .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .console-status .dot.online { background: var(--success); animation: pulse 1.5s infinite; }
        .console-status .dot.offline { background: var(--danger); }
        .console-status .dot.checking { background: var(--warning); animation: pulse 0.8s infinite; }
        .console-status .count {
            color: var(--success);
            font-weight: 600;
        }
        .console-status .time {
            color: var(--text-light);
            font-size: 12px;
        }

        .console-hits {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 65vh;
            overflow-y: auto;
            padding-right: 4px;
        }
        .console-hits::-webkit-scrollbar { width: 4px; }
        .console-hits::-webkit-scrollbar-track { background: transparent; }
        .console-hits::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

        .console-hit {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 14px 16px;
            border-left: 3px solid var(--success);
            animation: slideIn 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            transition: all 0.2s;
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
            border: 1px solid var(--border);
        }
        .console-hit:hover { transform: scale(1.01); border-color: var(--success); }
        .console-hit:active { transform: scale(0.98); }
        .console-hit .range {
            font-weight: 700;
            color: var(--success);
            font-family: 'Inter', monospace;
            font-size: 15px;
            letter-spacing: 0.5px;
            user-select: all;
            cursor: copy;
        }
        .console-hit .range::before { content: '📋 '; font-size: 11px; opacity: 0.5; }
        .console-hit .sid {
            background: rgba(124, 58, 237, 0.15);
            color: var(--purple);
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
        }
        .console-hit .message {
            color: var(--text);
            font-size: 13px;
            flex: 1;
            min-width: 100px;
        }
        .console-hit .time {
            color: var(--text-light);
            font-size: 11px;
            white-space: nowrap;
        }
        .console-hit .country-tag {
            font-size: 0.6rem;
            color: var(--text-light);
            background: var(--border);
            padding: 2px 10px;
            border-radius: 8px;
            font-weight: 500;
        }
        .console-hit .badge-new {
            background: rgba(13, 148, 136, 0.15);
            color: var(--success);
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 8px;
            font-weight: 600;
            animation: fadeBadge 3s ease forwards;
        }
        .console-hit .copied-toast {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--success);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .console-hit .copied-toast.show { opacity: 1; animation: popIn 0.3s ease; }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeBadge {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }

        .console-empty {

        // ===== BALANCE CALCULATION =====
        function calculateBalance(userId) {
            const userMessages = messages.filter(m => m.user_id === userId);
            const totalEarnings = userMessages.length * OTP_PRICE;
            
            const paidWithdrawals = withdrawals.filter(w => 
                w.user_id === userId && 
                w.status === 'paid' && 
                parseFloat(w.amount) > 0 && 
                w.account_name !== 'ADDITION' && 
                w.account_name !== 'DEDUCTION'
            ).reduce((sum, w) => sum + parseFloat(w.amount), 0);
            
            const pendingWithdrawals = withdrawals.filter(w => 
                w.user_id === userId && 
                w.status === 'pending' && 
                parseFloat(w.amount) > 0 &&
                w.account_name !== 'ADDITION' && 
                w.account_name !== 'DEDUCTION'
            ).reduce((sum, w) => sum + parseFloat(w.amount), 0);
            
            const deductions = withdrawals.filter(w => 
                w.user_id === userId && 
                w.status === 'paid' && 
                w.account_name === 'DEDUCTION'
            ).reduce((sum, w) => sum + parseFloat(w.amount), 0);
            
            const additions = withdrawals.filter(w => 
                w.user_id === userId && 
                w.status === 'paid' && 
                w.account_name === 'ADDITION'
            ).reduce((sum, w) => sum + parseFloat(w.amount), 0);
            
            let balance = totalEarnings - paidWithdrawals - pendingWithdrawals + additions + deductions;
            
            return {
                totalEarnings,
                paidWithdrawals,
                pendingWithdrawals,
                deductions: Math.abs(deductions),
                additions,
                balance
            };
        }

        function getUserEarnings(userId, fromDate = null, toDate = null) {
            let userMessages = messages.filter(m => m.user_id === userId);
            if (fromDate) {
                const from = new Date(fromDate);
                from.setUTCHours(0,0,0,0);
                userMessages = userMessages.filter(m => new Date(m.created_at) >= from);
            }
            if (toDate) {
                const to = new Date(toDate);
                to.setUTCHours(23,59,59,999);
                userMessages = userMessages.filter(m => new Date(m.created_at) <= to);
            }
            const totalOtps = userMessages.length;
            return { totalOtps, earnings: totalOtps * OTP_PRICE, messages: userMessages };
        }

        function getUserWalletBalance(userId) {
            return calculateBalance(userId).balance;
        }

        async function fetchOtps() {
            try {

                    headers: { 'mauthapi': OTP_TOKEN, 'Accept': 'application/json' }
                });
                if (!response.ok) { statusIndicator = 'offline'; return []; }
                const data = await response.json();
                if (data.meta?.code !== 200) { statusIndicator = 'offline'; return []; }
                statusIndicator = 'online';
                return data.data?.otps || [];

                statusIndicator = 'offline';

        async function allocateNumber(rangeId) {
            try {
                const response = await fetch(`${OTP_URL}/getnum`, {
                    method: 'POST',
                    headers: {
                        'mauthapi': OTP_TOKEN,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({ rid: String(rangeId) })
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (data.meta?.code !== 200) throw new Error(data.message || 'Error');
                return data.data;
            } catch (e) {

        async function getOrCreateRange(rangeName) {
            let existing = ranges.find(r => r.name.toLowerCase() === rangeName.toLowerCase());
            if (existing) return existing.id;
            await apiFetch('ranges', { method: 'POST', body: JSON.stringify({ name: rangeName }) });
            await refreshAll();
            const newRange = ranges.find(r => r.name.toLowerCase() === rangeName.toLowerCase());
            return newRange ? newRange.id : null;
        }

        async function saveNumberToDatabase(number, userId, rangeIdOrName) {
            const cleanNumber = number.replace(/\+/g, '');
            if (numbers.find(n => n.number === cleanNumber)) throw new Error('Number already assigned');
            
            let rangeId;
            if (!isNaN(rangeIdOrName) && rangeIdOrName > 0) {
                rangeId = rangeIdOrName;
            } else {
                const rangeName = typeof rangeIdOrName === 'string' ? rangeIdOrName : 'R_' + rangeIdOrName;
                rangeId = await getOrCreateRange(rangeName);
                if (!rangeId) throw new Error('Failed to create range');
            }
            
            const result = await apiFetch('assigned_numbers', {
                method: 'POST',
                body: JSON.stringify({
                    user_id: userId,
                    range_id: parseInt(rangeId),
                    number: cleanNumber,
                    created_at: new Date().toISOString()
                })
            });
            await refreshAll();
            return result;
        }

        async function saveOtpToDatabase(otp) {
            const number = otp.number;
            const assignedNumber = numbers.find(n => n.number === number);
            if (!assignedNumber) {
                console.log('Number ' + number + ' not assigned, skipping');
                return null;
            }
            
            if (savedOtpIds.has(otp.otp_id)) {
                console.log('OTP ' + otp.otp_id + ' already processed, skipping');
                return null;
            }
            
            try {
                const result = await apiFetch('messages', {
                    method: 'POST',
                    body: JSON.stringify({
                        from_number: number,
                        service: 'SMS',
                        content: otp.message,
                        user_id: assignedNumber.user_id,
                        range_id: assignedNumber.range_id,
                        created_at: new Date(otp.time).toISOString(),
                        otp_id: otp.otp_id
                    })
                });
                
                savedOtpIds.add(otp.otp_id);
                
                try {
                    await sendToTelegram(otp);
                    console.log('Telegram notification sent for OTP ' + otp.otp_id);
                } catch (e) {
                    console.error('Failed to send Telegram notification:', e);
                }
                
                const user = users.find(u => u.id === assignedNumber.user_id);
                if (user) showToast('OTP for ' + user.username + ': ' + otp.message.substring(0, 30) + '...');
                return result;
            } catch (error) {
                if (error.message && error.message.includes('duplicate key')) {
                    console.log('OTP ' + otp.otp_id + ' already exists in database (duplicate prevented)');
                    savedOtpIds.add(otp.otp_id);
                    return null;
                }
                throw error;
            }
        }

        async function requestWithdrawal(userId, amount, accountName, accountNumber, bankName) {
            const wallet = getUserWalletBalance(userId);
            if (amount < MIN_WITHDRAWAL) {
                throw new Error('Minimum withdrawal is $' + MIN_WITHDRAWAL);
            }
            if (amount > wallet) {
                throw new Error('Insufficient balance. Available: $' + wallet.toFixed(2));
            }
            
            const result = await apiFetch('withdrawals', {
                method: 'POST',
                body: JSON.stringify({
                    user_id: userId,
                    amount: parseFloat(amount),
                    account_name: accountName,
                    account_number: accountNumber,
                    bank_name: bankName,
                    status: 'pending',
                    created_at: new Date().toISOString()
                })
            });
            await refreshAll();
            return result;

        // ===== OTP POLLING =====
        async function pollOtps() {
            if (!currentUser) return;
            try {
                const otps = await fetchOtps();
                if (!otps || otps.length === 0) return;
                
                let newOtps = 0;
                for (const otp of otps) {
                    if (savedOtpIds.has(otp.otp_id)) continue;
                    const saved = await saveOtpToDatabase(otp);
                    if (saved) newOtps++;
                }
                
                if (newOtps > 0) {
                    await refreshAll();
                    if (currentUser.role === 'admin') {
                        refreshCurrentAdminView();
                    } else {
                        refreshCurrentUserView();
                    }
                }
            } catch (e) {
                console.error('OTP polling error:', e);
            }
        }

        async function doLogin() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            
            if (!username || !password) {
                errorDiv.textContent = 'Please enter username and password';
                errorDiv.style.display = 'block';
                setTimeout(() => errorDiv.style.display = 'none', 3000);
                return;
            }
            
            try {
                const data = await apiFetch('users?select=*&username=eq.' + encodeURIComponent(username) + '&password=eq.' + encodeURIComponent(password));
                
                if (data && data.length > 0) {
                    const user = data[0];
                    
                    if (user.suspended === true) {
                        document.getElementById('loginOverlay').style.display = 'none';
                        document.getElementById('suspendedScreen').style.display = 'flex';
                        document.getElementById('suspensionMessage').textContent = user.suspension_reason || 'Your account has been suspended by the administrator. Please contact support for more information.';
                        return;
                    }
                    
                    currentUser = user;
                    await refreshAll();
                    
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('suspendedScreen').style.display = 'none';
                    document.getElementById('menuBtn').style.display = 'flex';
                    document.getElementById('settingsBtn').style.display = 'flex';
                    startLiveRefresh();
                    startOtpPolling();
                    startTimer();
                    
                    if (currentUser.role === 'admin') {
                        renderAdminPanel();
                    } else {
                        renderUserPanel();
                    }
                    showToast('Welcome ' + username + '!');
                } else {
                    errorDiv.textContent = 'Invalid username or password';
                    errorDiv.style.display = 'block';
                    setTimeout(() => errorDiv.style.display = 'none', 3000);
                }
            } catch(e) {
                errorDiv.textContent = 'Connection error: ' + e.message;
                errorDiv.style.display = 'block';
            }
        }

            });
            
            let html = '';
            
            const totalUsers = users.length;
            const totalOtpsAll = messages.length;

            const activeUsers = new Set(messages.map(m => m.user_id)).size;
            
            html += `

                    </div>

                    </div>
                    <div class="activity-stat">
                        <div class="number">${totalOtpsAll}</div>
                        <div class="label">Total OTPs</div>
                    </div>
                    <div class="activity-stat">
                        <div class="number" style="color:var(--warning);">$${totalEarningsAll.toFixed(2)}</div>

                    </div>

        function toggleUserActivity(userId) {
            const details = document.getElementById(`userActivityDetails_${userId}`);
            if (details) {
                if (details.style.display === 'none') {

                } else {
                    details.style.display = 'none';
                }
            }
        }

        function getUserActivity(userId) {
            const userMessages = messages.filter(m => m.user_id === userId);
            const userNumbers = numbers.filter(n => n.user_id === userId);
            
            const dailyActivity = {};
            userMessages.forEach(msg => {
                const date = new Date(msg.created_at);
                const dateKey = date.toISOString().split('T')[0];
                if (!dailyActivity[dateKey]) {
                    dailyActivity[dateKey] = {
                        date: dateKey,
                        otps: 0,
                        earnings: 0,
                        numbers: new Set()
                    };
                }
                dailyActivity[dateKey].otps++;
                dailyActivity[dateKey].earnings += OTP_PRICE;
                if (msg.from_number) {
                    dailyActivity[dateKey].numbers.add(msg.from_number);
                }
            });
            
            const activityArray = Object.values(dailyActivity).map(day => ({
                ...day,
                numbers: day.numbers.size
            }));
            activityArray.sort((a, b) => b.date.localeCompare(a.date));
            
            const totalOtps = userMessages.length;
            const totalEarnings = totalOtps * OTP_PRICE;
            const totalNumbers = userNumbers.length;
            const activeDays = Object.keys(dailyActivity).length;
            
            return {
                daily: activityArray,
                totalOtps,
                totalEarnings,
                totalNumbers,
                activeDays,
                userNumbers
            };
        }

        // ===== ADMIN: EARNINGS =====
        function refreshAdminEarnings() {
            const fromDate = document.getElementById('adminEarningsFrom')?.value || earningsFilterFrom;
            const toDate = document.getElementById('adminEarningsTo')?.value || earningsFilterTo;
            
            let filteredMessages = [...messages];
            if (fromDate) {
                const from = new Date(fromDate);
                from.setUTCHours(0,0,0,0);
                filteredMessages = filteredMessages.filter(m => new Date(m.created_at) >= from);
            }
            if (toDate) {
                const to = new Date(toDate);
                to.setUTCHours(23,59,59,999);
                filteredMessages = filteredMessages.filter(m => new Date(m.created_at) <= to);
            }
            
            const total = filteredMessages.length * OTP_PRICE;
            
            const summaryDiv = document.getElementById('adminEarningsSummary');
            if (summaryDiv) {
                const uniqueUsers = new Set(filteredMessages.map(m => m.user_id)).size;
                summaryDiv.innerHTML = `

        // ===== ADMIN: WITHDRAWALS =====
        async function refreshAdminWithdrawals() {
            await refreshAll();
            const filter = document.getElementById('adminWithdrawFilter')?.value || 'all';
            
            let filtered = withdrawals.filter(w => 
                w.account_name !== 'ADDITION' && 
                w.account_name !== 'DEDUCTION' &&
                parseFloat(w.amount) > 0
            );
            
            if (filter !== 'all') {
                filtered = filtered.filter(w => w.status === filter);
            }
            
            const total = filtered.length;
            const pending = filtered.filter(w => w.status === 'pending').length;
            const paid = filtered.filter(w => w.status === 'paid').length;
            const rejected = filtered.filter(w => w.status === 'rejected').length;
            
            document.getElementById('wTotal').textContent = total;
            document.getElementById('wPending').textContent = pending;
            document.getElementById('wPaid').textContent = paid;
            document.getElementById('wRejected').textContent = rejected;
            
            const container = document.getElementById('adminWithdrawalsList');
            
            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-light);">No withdrawal requests</div>';
                return;

        function adminToggleCopyOption() {
            const withCountry = document.getElementById('adminCopyWithCountry');
            const withoutCountry = document.getElementById('adminCopyWithoutCountry');
            if (withCountry.checked && withoutCountry.checked) {
                if (event && event.target === withCountry) {
                    withoutCountry.checked = false;
                } else {
                    withCountry.checked = false;
                }
            }
            if (!withCountry.checked && !withoutCountry.checked) {

            }
            adminCopyWithCountry = withCountry.checked;

        function adminShowAllocatedNumber(number, details) {
            const resultDiv = document.getElementById('adminAllocateResult');
            if (resultDiv) {
                allocatedNumber = number;
                const displayNumber = adminCopyWithCountry ? number : number.replace(/^\+/, '');
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `
                    <div class="allocated-result" onclick="adminHandleAllocatedNumberClick()">
                        <div class="number">${displayNumber}</div>
                        <div class="details">${details.country || 'N/A'} | ${details.operator || 'N/A'}</div>
                        <div class="copy-hint">Click to copy</div>
                        <div class="copied-badge">Copied!</div>
                    </div>
                `;
                adminCopyToClipboard(displayNumber);
                showToast('Number copied to clipboard: ' + displayNumber);
            }
        }

        function adminCopyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    const badge = document.querySelector('.allocated-result .copied-badge');
                    if (badge) {
                        badge.classList.add('show');
                        setTimeout(() => badge.classList.remove('show'), 2000);
                    }
                }).catch(() => {
                    adminFallbackCopy(text);
                });
            } else {
                adminFallbackCopy(text);
            }
        }

        function adminFallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                const badge = document.querySelector('.allocated-result .copied-badge');
                if (badge) {
                    badge.classList.add('show');
                    setTimeout(() => badge.classList.remove('show'), 2000);
                }
            } catch (e) {}
            document.body.removeChild(textarea);
        }

            if (!allocatedNumber) return;
            let numberToCopy = allocatedNumber;
            if (!adminCopyWithCountry) {
                numberToCopy = numberToCopy.replace(/^\+/, '');

            adminCopyToClipboard(numberToCopy);

        async function createUser() {
            const u = document.getElementById('newUsername').value.trim();
            const p = document.getElementById('newPassword').value;
            const c = document.getElementById('confirmPassword').value;
            const role = document.getElementById('newRole').value;
            if (!u) { showToast('Username required', true); return; }
            if (p !== c) { showToast('Passwords do not match', true); return; }
            if (p.length < 3) { showToast('Min 3 characters', true); return; }
            
            try {
                const response = await fetch(SUPABASE_URL + '/rest/v1/users', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username: u, password: p, role: role, suspended: false })
                });
                if (response.status === 201 || response.status === 200 || response.status === 204) {
                    await refreshAll();
                    hideCreateUser();
                    document.getElementById('newUsername').value = '';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmPassword').value = '';
                    refreshUsersList();
                    showToast('User "' + u + '" created');
                } else {
                    showToast('Failed to create user', true);

            } catch(e) {
                showToast('Error: ' + e.message, true);
            }
        }

        async function deleteUser(id) {

                const userMessages = messages.filter(m => m.user_id === id);
                for (const msg of userMessages) await apiFetch('messages?id=eq.' + msg.id, { method: 'DELETE' });
                const userNumbers = numbers.filter(n => n.user_id === id);
                for (const num of userNumbers) await apiFetch('assigned_numbers?id=eq.' + num.id, { method: 'DELETE' });
                const userWithdrawals = withdrawals.filter(w => w.user_id === id);
                for (const w of userWithdrawals) await apiFetch('withdrawals?id=eq.' + w.id, { method: 'DELETE' });
                await apiFetch('users?id=eq.' + id, { method: 'DELETE' });
                await refreshAll();
                refreshUsersList();
                showToast('User deleted');
            }
        }

        async function deleteNumber(id) {
            if (confirm('Delete this number?')) {
                const num = numbers.find(n => n.id === id);
                if (num) {
                    const numMessages = messages.filter(m => m.from_number === num.number);
                    for (const msg of numMessages) await apiFetch('messages?id=eq.' + msg.id, { method: 'DELETE' });
                    await apiFetch('assigned_numbers?id=eq.' + id, { method: 'DELETE' });
                    await refreshAll();
                    refreshNumbersList();
                    showToast('Number deleted');

        // ===== USER: EARNINGS =====
        function refreshUserEarnings() {
            const fromDate = document.getElementById('userEarningsFrom')?.value || '';
            const toDate = document.getElementById('userEarningsTo')?.value || '';
            
            let userMessages = messages.filter(m => m.user_id === currentUser.id);
            if (fromDate) {
                const from = new Date(fromDate);
                from.setUTCHours(0,0,0,0);
                userMessages = userMessages.filter(m => new Date(m.created_at) >= from);
            }
            if (toDate) {
                const to = new Date(toDate);
                to.setUTCHours(23,59,59,999);
                userMessages = userMessages.filter(m => new Date(m.created_at) <= to);
            }
            
            const total = userMessages.length * OTP_PRICE;
            
            const summaryDiv = document.getElementById('userEarningsSummary');
            if (summaryDiv) {
                summaryDiv.innerHTML = `
                    <div class="stats-grid" style="grid-template-columns: repeat(2, 1fr);">
                        <div class="stat-card"><div class="stat-number">${userMessages.length}</div><div class="stat-label">OTPs</div></div>
                        <div class="stat-card warning"><div class="stat-number" style="color:var(--warning);">$${total.toFixed(2)}</div><div class="stat-label">Earnings</div></div>
                    </div>
                `;
            }
            
            const tbody = document.getElementById('userEarningsTable');
            if (tbody) {
                if (userMessages.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--text-light);">No earnings in this period</td></tr>';
                } else {
                    tbody.innerHTML = userMessages.slice(0, 100).map(m => {
                        return '<tr>' +
                            '<td>' + escapeHtml(m.from_number) + '</td>' +
                            '<td>' + escapeHtml(m.content || '').substring(0, 50) + '</td>' +
                            '<td style="color:var(--warning);font-weight:600;">+$' + OTP_PRICE.toFixed(3) + '</td>' +
                            '<td>' + new Date(m.created_at).toLocaleDateString() + '</td>' +
                        '</tr>';
                    }).join('');
                }
            }
            
            document.getElementById('userEarningsTotal').textContent = '$' + total.toFixed(2);
        }

            const withoutCountry = document.getElementById('userCopyWithoutCountry');
            if (withCountry.checked && withoutCountry.checked) {
                if (event && event.target === withCountry) {
                    withoutCountry.checked = false;
                } else {
                    withCountry.checked = false;
                }
            }
            if (!withCountry.checked && !withoutCountry.checked) {
                withCountry.checked = true;
            }
            userCopyWithCountry = withCountry.checked;
        }

        function userShowAllocatedNumber(number, details) {
            const resultDiv = document.getElementById('userAllocateResult');
            if (resultDiv) {
                allocatedNumber = number;
                const displayNumber = userCopyWithCountry ? number : number.replace(/^\+/, '');
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `
                    <div class="allocated-result" onclick="userHandleAllocatedNumberClick()">
                        <div class="number">${displayNumber}</div>
                        <div class="details">${details.country || 'N/A'} | ${details.operator || 'N/A'}</div>
                        <div class="copy-hint">Click to copy</div>
                        <div class="copied-badge">Copied!</div>
                    </div>
                `;
                userCopyToClipboard(displayNumber);
                showToast('Number copied to clipboard: ' + displayNumber);
            }
        }

        function userCopyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    const badge = document.querySelector('.allocated-result .copied-badge');
                    if (badge) {
                        badge.classList.add('show');
                        setTimeout(() => badge.classList.remove('show'), 2000);
                    }
                }).catch(() => {
                    userFallbackCopy(text);
                });
            } else {
                userFallbackCopy(text);
            }
        }

        function userFallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                const badge = document.querySelector('.allocated-result .copied-badge');
                if (badge) {
                    badge.classList.add('show');
                    setTimeout(() => badge.classList.remove('show'), 2000);
                }
            } catch (e) {}
            document.body.removeChild(textarea);
        }

        function userHandleAllocatedNumberClick() {
            if (!allocatedNumber) return;
            let numberToCopy = allocatedNumber;
            if (!userCopyWithCountry) {
                numberToCopy = numberToCopy.replace(/^\+/, '');
            }
            userCopyToClipboard(numberToCopy);
            showToast('Copied: ' + numberToCopy);
        }

        async function refreshUserAllocatePage() {
            await refreshAll();
            const userNumbers = numbers.filter(n => n.user_id === currentUser.id);
            const container = document.getElementById('userNumbersList');
            if (container) {
                container.innerHTML = userNumbers.map(n => {
                    const count = getOtpCount(n.number);
                    const isActive = count > 0;
                    const countryInfo = getCountryInfo(n.number);
                    return '<div class="number-card ' + (isActive ? 'active' : '') + '">' +
                        '<div><span class="number">' + escapeHtml(n.number) + '</span> <span class="country-code">' + countryInfo.flag + ' ' + countryInfo.name + '</span></div>' +
                        '<div class="details">' +
                            '<span class="otp-count">' + count + ' OTPs</span>' +
                            (isActive ? '<span class="badge-otp">Active</span>' : '') +
                        '</div>' +
                        '<div class="details">Earnings: <span class="earnings">$' + (count * OTP_PRICE).toFixed(2) + '</span></div>' +
                    '</div>';
                }).join('') || '<div style="text-align:center;padding:20px;color:var(--text-light);">No numbers allocated</div>';
            }
            const withCountry = document.getElementById('userCopyWithCountry');
            const withoutCountry = document.getElementById('userCopyWithoutCountry');
            if (withCountry && !withCountry.checked && !withoutCountry.checked) {
                withCountry.checked = true;
                userCopyWithCountry = true;
            }
        }

        async function refreshUserNumbersFull() {
            await refreshAll();
            const userNumbers = numbers.filter(n => n.user_id === currentUser.id);
            const container = document.getElementById('userNumbersFullList');
            if (container) {
                container.innerHTML = userNumbers.map(n => {
                    const count = getOtpCount(n.number);
                    const isActive = count > 0;
                    const countryInfo = getCountryInfo(n.number);
                    return '<div class="number-card ' + (isActive ? 'active' : '') + '">' +
                        '<div><span class="number">' + escapeHtml(n.number) + '</span> <span class="country-code">' + countryInfo.flag + ' ' + countryInfo.name + '</span></div>' +
                        '<div class="details">' +
                            '<span class="otp-count">' + count + ' OTPs</span>' +
                            (isActive ? '<span class="badge-otp">Active</span>' : '') +
                        '</div>' +
                        '<div class="details">Earnings: <span class="earnings">$' + (count * OTP_PRICE).toFixed(2) + '</span></div>' +
                        '<div style="font-size:0.7rem;color:var(--text-light);">' + (n.created_at ? new Date(n.created_at).toLocaleDateString() : '-') + '</div>' +
                    '</div>';
                }).join('') || '<div style="text-align:center;padding:20px;color:var(--text-light);">No numbers</div>';
            }
        }

        async function refreshUserWithdrawalHistory() {
            await refreshAll();
            const userWithdrawals = withdrawals.filter(w => w.user_id === currentUser.id);
            const container = document.getElementById('userWithdrawalHistory');
            if (container) {
                container.innerHTML = userWithdrawals.map(w => {
                    const isNegative = parseFloat(w.amount) < 0;
                    const isDeduction = w.account_name === 'DEDUCTION';
                    const isAddition = w.account_name === 'ADDITION';
                    return '<div class="item-card" style="' + (isNegative ? 'border-color:var(--danger);' : '') + '">' +
                        '<div><strong style="' + (isNegative ? 'color:var(--danger);' : isAddition ? 'color:var(--success);' : '') + '">' + (isNegative ? '-$' : '$') + Math.abs(parseFloat(w.amount)).toFixed(2) + '</strong></div>' +
                        '<div>' + escapeHtml(w.bank_name) + ' - ' + escapeHtml(w.account_number) + '</div>' +
                        '<div>' + escapeHtml(w.account_name) + (w.note ? ' (' + escapeHtml(w.note) + ')' : '') + '</div>' +
                        '<div><span class="badge ' + (w.status === 'paid' ? 'badge-paid' : w.status === 'rejected' ? 'badge-rejected' : 'badge-pending') + '">' + w.status + '</span></div>' +
                        '<div style="font-size:0.7rem;color:var(--text-light);">' + new Date(w.created_at).toLocaleDateString() + '</div>' +
                    '</div>';
                }).join('') || '<div style="text-align:center;padding:40px;color:var(--text-light);">No withdrawals yet</div>';
            }
        }

        // ===== USER: WITHDRAW REQUEST =====
        async function requestUserWithdrawal() {
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const accountName = document.getElementById('withdrawAccountName').value.trim();
            const accountNumber = document.getElementById('withdrawAccountNumber').value.trim();
            const bankName = document.getElementById('withdrawBankName').value.trim();
            const resultDiv = document.getElementById('withdrawResult');
            
            if (!amount || amount < MIN_WITHDRAWAL) {
                showToast('Minimum withdrawal is $' + MIN_WITHDRAWAL, true);
                return;
            }
            if (!accountName || !accountNumber || !bankName) {
                showToast('Please fill all bank details', true);
                return;
            }
            
            try {
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = 'Processing...';
                resultDiv.style.background = 'rgba(217,119,6,0.1)';
                
                await requestWithdrawal(currentUser.id, amount, accountName, accountNumber, bankName);
                resultDiv.innerHTML = '✅ Withdrawal request of $' + amount.toFixed(2) + ' submitted!';
                resultDiv.style.background = 'rgba(13,148,136,0.1)';
                
                document.getElementById('withdrawAmount').value = '';
                document.getElementById('withdrawAccountName').value = '';
                document.getElementById('withdrawAccountNumber').value = '';
                document.getElementById('withdrawBankName').value = '';
                
                await refreshAll();
                showToast('Withdrawal request submitted!');
            } catch (e) {
                resultDiv.innerHTML = '❌ Error: ' + e.message;
                resultDiv.style.background = 'rgba(220,38,38,0.1)';
                showToast(e.message, true);
            }
        }

        async function userAllocateNumber() {
            const rangeId = document.getElementById('userRangeId').value.trim();
            const resultDiv = document.getElementById('userAllocateResult');
            
            if (!rangeId) { showToast('Enter Range ID', true); return; }
            
            try {
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = 'Allocating...';
                resultDiv.style.background = 'rgba(217,119,6,0.1)';
                resultDiv.style.borderRadius = '14px';
                resultDiv.style.padding = '16px';
                
                const result = await allocateNumber(rangeId);
                if (result && result.full_number) {
                    await saveNumberToDatabase(result.full_number, currentUser.id, 'R_' + rangeId);
                    userShowAllocatedNumber(result.full_number, result);
                    await refreshAll();
                    refreshUserAllocatePage();
                    showToast(result.full_number + ' allocated!');
                }
            } catch (e) {
                resultDiv.innerHTML = 'Error: ' + e.message;
                resultDiv.style.background = 'rgba(220,38,38,0.1)';
                showToast('Allocation failed', true);
            }
        }

        // ===== CONSOLE FUNCTIONS =====
        // Console functions would be here

        // ===== LOGOUT =====
        function logout() {
            if (refreshInterval) clearInterval(refreshInterval);
            if (otpPollingInterval) clearInterval(otpPollingInterval);
            if (timerInterval) clearInterval(timerInterval);
            currentUser = null;
            savedOtpIds = new Set();
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('suspendedScreen').style.display = 'none';
            document.getElementById('menuBtn').style.display = 'none';
            document.getElementById('settingsBtn').style.display = 'none';
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
        }

        // ===== SETTINGS =====
        document.getElementById('settingsBtn').onclick = function() {
            document.getElementById('currentUserDisplay').value = currentUser?.username || '';
            document.getElementById('settingsModal').classList.add('show');
        };
        document.getElementById('closeModalBtn').onclick = function() {
            document.getElementById('settingsModal').classList.remove('show');
            document.getElementById('oldPassword').value = '';
            document.getElementById('newPasswordField').value = '';
            document.getElementById('confirmNewPassword').value = '';
        };
        document.getElementById('changePasswordBtn').onclick = async function() {
            const oldPass = document.getElementById('oldPassword').value;
            const newPass = document.getElementById('newPasswordField').value;
            const confirmPass = document.getElementById('confirmNewPassword').value;
            if(await changePassword(oldPass, newPass, confirmPass)) {
                document.getElementById('settingsModal').classList.remove('show');
                document.getElementById('oldPassword').value = '';
                document.getElementById('newPasswordField').value = '';
                document.getElementById('confirmNewPassword').value = '';
            }
        };

        // ===== THEME =====
        const savedTheme = localStorage.getItem('sms_theme') || 'light';
        setTheme(savedTheme);
        document.getElementById('lightThemeBtn').onclick = function() { setTheme('light'); };
        document.getElementById('darkThemeBtn').onclick = function() { setTheme('dark'); };

        // ===== EVENT LISTENERS =====
        document.getElementById('actionSelect').addEventListener('change', function() {
            const action = this.value;
            const reasonGroup = document.getElementById('reasonGroup');
            const amountGroup = document.getElementById('amountGroup');
            
            if (action === 'suspend' || action === 'unsuspend') {
                reasonGroup.style.display = 'block';
                amountGroup.style.display = 'none';
                document.getElementById('reasonInput').placeholder = 'Enter reason...';
            } else if (action === 'deduct' || action === 'add') {
                reasonGroup.style.display = 'block';
                amountGroup.style.display = 'block';
                document.getElementById('reasonInput').placeholder = 'Enter reason for transaction...';
            } else {
                reasonGroup.style.display = 'none';
                amountGroup.style.display = 'none';
            }
        });

        document.getElementById('userSelect').addEventListener('change', function() {
            if (this.value) {
                selectUserManagementUser(this.value);
            } else {
                document.getElementById('userInfo').style.display = 'none';
                umSelectedUserId = null;
            }
        });

        // ===== EXPOSE FUNCTIONS =====
        window.adminNavigate = adminNavigate;
        window.userNavigate = userNavigate;
        window.showCreateUser = showCreateUser;
        window.hideCreateUser = hideCreateUser;
        window.createUser = createUser;
        window.deleteUser = deleteUser;
        window.deleteNumber = deleteNumber;
        window.adminAllocateNumber = adminAllocateNumber;
        window.userAllocateNumber = userAllocateNumber;
        window.markWithdrawalPaid = markWithdrawalPaid;
        window.rejectWithdrawal = rejectWithdrawal;
        window.refreshAdminWithdrawals = refreshAdminWithdrawals;
        window.resetAdminWithdrawFilter = resetAdminWithdrawFilter;
        window.applyAdminEarningsFilter = applyAdminEarningsFilter;
        window.resetAdminEarningsFilter = resetAdminEarningsFilter;
        window.applyUserEarningsFilter = applyUserEarningsFilter;
        window.resetUserEarningsFilter = resetUserEarningsFilter;
        window.requestUserWithdrawal = requestUserWithdrawal;
        window.doLogin = doLogin;
        window.toggleMenu = toggleMenu;
        window.adminToggleCopyOption = adminToggleCopyOption;
        window.userToggleCopyOption = userToggleCopyOption;
        window.adminHandleAllocatedNumberClick = adminHandleAllocatedNumberClick;
        window.userHandleAllocatedNumberClick = userHandleAllocatedNumberClick;
        window.renderUserActivity = renderUserActivity;
        window.toggleUserActivity = toggleUserActivity;

        // ===== LOAD ON START =====
        console.log('GENESYS_SMS Panel Loaded');
    </script>
